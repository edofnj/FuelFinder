<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#00cec9"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e0f7fa" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6c5ce7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#00cec9" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="104" fill="#0d0d1a"/>

  <!-- Ambient glow behind pin -->
  <ellipse cx="256" cy="210" rx="160" ry="150" fill="url(#glow)"/>

  <!-- Map pin / location marker -->
  <path d="M256,426
           C218,398 144,338 144,198
           A112,112 0 0 1 368,198
           C368,338 294,398 256,426Z"
        fill="url(#pin)" filter="url(#shadow)"/>

  <!-- Inner dark circle (hole in pin) -->
  <circle cx="256" cy="198" r="58" fill="#0d0d1a"/>

  <!-- Subtle inner ring highlight -->
  <circle cx="256" cy="198" r="58" fill="none" stroke="url(#pin)" stroke-width="2" opacity="0.35"/>

  <!-- Fuel drop (teardrop, point at top) -->
  <path d="M256,154
           C230,168 230,185 230,200
           A26,26 0 0 0 282,200
           C282,185 282,168 256,154Z"
        fill="url(#drop)"/>

  <!-- Drop specular highlight -->
  <path d="M246,167 C243,174 242,183 244,191"
        stroke="white" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55"/>

  <!-- Small fuel line at bottom of drop (nozzle hint) -->
  <rect x="249" y="225" width="14" height="7" rx="3.5" fill="white" opacity="0.45"/>
</svg>
